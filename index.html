                { name: "Aerodrive", type: ["V"], rule: "Ignore terrain/collisions. Motion 3." },
                { name: "Amplifier", type: ["M"], rule: "+1 Power before attack." },
                { name: "Armour", type: ["I", "V"], rule: "5+ ignore hit (3+ if x2)." },
                { name: "Booster", type: ["A"], rule: '1/turn gain class Heat to rotate & move 3".' },
                { name: "Carrier", type: ["M", "V"], rule: "Carry 2 Inf. Deploy on move." },
                { name: "Casing", type: ["M"], rule: "Internal dmg hits here instead." },
                { name: "Catalyst", type: ["M"], rule: "1st attack -1 Heat." },
                { name: "Cloak", type: ["A"], rule: "Hold = Motion 6." },
                { name: "Conductor", type: ["A"], rule: 'End move: 1 Heat to visible MAC w/in 3".' },
                { name: "Coolant", type: ["M"], rule: "Cool -2 Heat. Destroy: +2 Heat." },
                { name: "Disruptor", type: ["A"], rule: 'End move: Visible MAC w/in 3" check/crash.' },
                { name: "Dozer", type: ["V"], rule: "+2 classes for collisions." },
                { name: "ECM", type: ["M"], rule: "End attack: +1 Motion." },
                { name: "Emitter", type: ["A"], rule: 'End move: 1 Rad to visible MAC w/in 3".' },
                { name: "Frame", type: ["M"], special: "cost_reduce", rule: "-1 pt Cost." },
                { name: "Gravlock", type: ["A"], rule: "End move: Set Motion 1." },
                { name: "Guardian", type: ["M"], rule: "Cool -1 Rad & -1 Jolt." },
                { name: "Gyro", type: ["A"], rule: "Rough/Cover = Open." },
                { name: "Hooks", type: ["I"], rule: "Move with touching MAC." },
                { name: "Hotstepper", type: ["A"], rule: "Jump collide = +1 Hit & 1 Heat." },
                { name: "Hoverfoil", type: ["A"], rule: "Rough/Water = Open." },
                { name: "Intake", type: ["M"], rule: "Jump = -1 Heat." },
                { name: "Jet", type: ["A"], rule: 'Jump 9"/jet.' },
                { name: "Mesh", type: ["M"], rule: "<3 hits? Ignore hits here." },
                { name: "Plate", type: ["M"], rule: "4+ ignore hit here." },
                { name: "Precog", type: ["M"], rule: "Redraw init card for 1 Heat." },
                { name: "Prism", type: ["M"], rule: "End attack: -1 Heat per ranged shot." },
                { name: "Radiator", type: ["M"], rule: "Cool -1 Heat." },
                { name: "Reflector", type: ["M"], rule: "3+ hits? Ignore hits here." },
                { name: "Rotor", type: ["M"], rule: "Extra rotate during move." },
                { name: "Servo", type: ["M"], rule: "Shift/Rush = -1 Heat." },
                { name: "Shield", type: ["M"], rule: "1 Heat to ignore hit here." },
                { name: "Tether", type: ["A"], rule: 'End move: 1 Jolt to visible MAC w/in 3".' },
                { name: "Transport", type: ["I"], rule: "Unit can Rush." },
                { name: "Vent", type: ["M"], rule: "Hold = -2 Heat." },
                // Faction Modules
                { name: "Rampart", type: ["M"], rule: "Roll 2+ to ignore each hit to this module if undamaged." },
                { name: "Extinguisher", type: ["M"], rule: "Cooldown: Take hit here to remove ALL Heat." },
                { name: "Seeker", type: ["M"], rule: "Gain 1 Heat to give all attacks -1TN." },
                { name: "Spire", type: ["M"], rule: "S-Range Pwr 1, No Type, Any Facing, 0 Heat." },
                { name: "Mindhive", type: ["A"], rule: "Activate: Peek init deck. 1 Heat to shuffle." },
                { name: "Halo", type: ["A"], rule: "Destroy to ignore ALL hits from 1 attack." },
                { name: "Converter", type: ["A"], rule: "Before attack: Change subtype to Rad or Thermal." },
                { name: "Spine", type: ["A"], rule: "Collide: +1 Hit dealt, -1 Hit taken." },
                { name: "Crucible", type: ["M"], rule: "Cooldown -2 Heat. Hit here = +1 Rad." },
            ];

            // --- Card Data ---
            const SUITS = [
                { name: "Spades", symbol: "♠", color: "text-slate-900", label: "Black" },
                { name: "Clubs", symbol: "♣", color: "text-slate-900", label: "Black" },
                { name: "Hearts", symbol: "♥", color: "text-red-600", label: "Red" },
                { name: "Diamonds", symbol: "♦", color: "text-red-600", label: "Red" },
            ];
            const RANKS = ["A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];

            // --- Helper Functions ---

            const generateSubTypeCode = (w) => {
                if (w.subtype || w.expendable) {
                    return `-${w.subtype || ""}${w.expendable ? EXPENDABLE_SUBTYPE.id : ""}`;
                }
                return "";
            };

            const generateWeaponCode = (w, useDouble = true) => {
                if (!w.range || !w.type || !w.power) return "---";
                const isDouble = useDouble && w.isDouble;
                return `${isDouble ? "2x " : ""}${w.range}${w.type}${w.power}${generateSubTypeCode(w)}`;
            };

            const generateBrawlCode = (b, useDouble = true) => {
                if (!b.brawlId) {
                    return "---";
                }
                const isDouble = useDouble && b.isDouble;
                return `${isDouble ? "2x " : ""}${b.brawlId}${generateSubTypeCode(b)}`;
            };

            const getModuleRule = (mod, useDouble = true) => {
                let parts = [];
                if (useDouble && mod.isDouble) parts.push("DOUBLE: Two in one slot (+1pt)");
                if (mod.category === "WEAPON") {
                    const r = WEAPON_RANGES.find((x) => x.id === mod.range);
                    const t = WEAPON_TYPES.find((x) => x.id === mod.type);
                    const s = WEAPON_SUBTYPES.find((x) => x.id === mod.subtype);
                    if (r && r.rule) parts.push(r.rule);
                    if (t && t.rule) parts.push(t.rule);
                    if (mod.expendable) {
                        parts.push(EXPENDABLE_SUBTYPE.rule);
                    }
                    if (s && s.rule) parts.push(s.rule);
                } else if (mod.category === "BRAWL") {
                    const b = BRAWL_WEAPONS.find((x) => x.id === mod.brawlId);
                    if (b) parts.push(b.rule);
                    if (mod.expendable) {
                        parts.push(EXPENDABLE_SUBTYPE.rule);
                    }
                    const s = WEAPON_SUBTYPES.find((x) => x.id === mod.subtype);
                    if (s && s.rule) parts.push(s.rule);
                } else if (mod.category === "HW") {
                    const h = HARDWARE.find((x) => x.name === mod.hwName);
                    if (h) parts.push(h.rule);
                }
                return parts.join(" | ");
            };

            const calculateCost = (unit, useDouble = true) => {
                const typeInfo = UNIT_TYPES[unit.type];
                if (!typeInfo) return 0;

                if (typeInfo.type === "ASSET") {
                    const asset = REMOTE_ASSETS.find((a) => a.name === unit.assetName);
                    return (asset ? asset.cost : 0) * (unit.count || 1);
                }

                let cost = typeInfo.baseCost;
                let hardwareCount = 0;
                let weaponPowerSum = 0;

                if (unit.modules) {
                    unit.modules.forEach((mod) => {
                        let modCost = 0;
                        if (mod.category === "HW") {
                            hardwareCount++;
                            if (mod.hwName === "Frame" && typeInfo.type === "MAC") {
                                cost -= 1;
                            }
                        } else if (mod.category === "WEAPON") {
                            weaponPowerSum += parseInt(mod.power) || 0;
                        } else if (mod.category === "BRAWL") {
                            weaponPowerSum += 1;
                        }

                        if (useDouble && mod.isDouble) {
                            cost += 1;
                        }
                    });
                }

                if (typeInfo.type === "AU") {
                    cost += hardwareCount + weaponPowerSum;
                }

                return Math.max(0, cost) * (unit.count || 1);
            };

            const getFormationLimit = (typeId) => {
                if (typeId === "INF") return 5;
                if (typeId === "VEH") return 3;
                return 1;
            };

            const checkValidation = (unit, variantRules) => {
                const errors = [];
                const typeInfo = UNIT_TYPES[unit.type];

                if (!typeInfo || typeInfo.type === "ASSET") return errors;

                if (typeInfo.type === "MAC") {
                    unit.modules.forEach((mod, idx) => {
                        if (mod.category === "WEAPON") {
                            const power = parseInt(mod.power) || 0;

                            if (mod.isSlot0) {
                                errors.push("Slot 0 must be Hardware.");
                            } else {
                                const slotNum = mod.isSlot0 ? 0 : unit.modules[0].isSlot0 ? idx : idx + 1;

                                if (slotNum === 1) {
                                    if (power > typeInfo.maxMain)
                                        errors.push(`Slot 1 Power ${power} exceeds Class limit (${typeInfo.maxMain})`);
                                } else if (slotNum > 1) {
                                    if (power > typeInfo.maxSub)
                                        errors.push(
                                            `Slot ${slotNum} Power ${power} exceeds Class limit (${typeInfo.maxSub})`
                                        );
                                }
                            }
                        }
                    });
                } else {
                    let weaponCount = 0;
                    unit.modules.forEach((mod) => {
                        if (mod.category === "WEAPON" || mod.category === "BRAWL") {
                            weaponCount++;
                            const power = parseInt(mod.power) || (mod.category === "BRAWL" ? 1 : 0);
                            if (power > typeInfo.maxSub)
                                errors.push(`Weapon Power ${power} exceeds limit (${typeInfo.maxSub})`);
                        }
                    });
                    if (weaponCount > 2) errors.push("AUs cannot have more than 2 weapons");
                }

                // Duplicate Check
                const counts = {};
                unit.modules.forEach((mod) => {
                    let key = null;
                    if (mod.category === "WEAPON")
                        key = generateWeaponCode(mod, false); // Base key only
                    else if (mod.category === "HW") key = mod.hwName;
                    else if (mod.category === "BRAWL") key = mod.brawlId;

                    if (key && mod.category !== "EMPTY") {
                        const increment = (variantRules.doubleModules && mod.isDouble) ? 2 : 1;
                        counts[key] = (counts[key] || 0) + increment;
                    }
                });

                const maxDupes = typeInfo.type === "MAC" ? 3 : 2;
                for (const [key, count] of Object.entries(counts)) {
                    const limit = key === "V-Drill" ? 2 : maxDupes;
                    if (count > limit) {
                        errors.push(`Max ${limit} ${key} allowed (Has ${count}).`);
                    }
                }

                // Units can carry a maximum of 2 brawl weapons, which must be identical.
                let brawlWeaponCount = 0;
                let brawlWeapon = null;
                let brawlWeaponSlot = -1;

                unit.modules.forEach((mod, idx) => {
                    const isBrawlWeapon = mod.category === "BRAWL";
                    if (!isBrawlWeapon) {
                        return;
                    }
                    brawlWeaponCount += 1;
                    const slotNum = mod.isSlot0 ? 0 : unit.modules[0].isSlot0 ? idx : idx + 1;
                    if (brawlWeapon === null) {
                        brawlWeapon = mod;
                        brawlWeaponSlot = slotNum;
                    } else if (
                        brawlWeapon.category !== mod.category ||
                        brawlWeapon.brawlId !== mod.brawlId ||
                        brawlWeapon.expendable !== mod.expendable ||
                        brawlWeapon.subtype !== mod.subtype
                    ) {
                        errors.push(
                            `Brawl weapons must be identical (Has different weapons in slots ${brawlWeaponSlot} and ${slotNum}).`
                        );
                    }
                });
                if (brawlWeaponCount > 2) {
                    errors.push(`Units can carry a maximum of 2 brawl weapons (Has ${brawlWeaponCount}).`);
                }

                // Hired MAC Dual Variant Validations
                if (unit.isMerc && variantRules.hiredMercs && unit.variantModules && typeInfo.type === 'MAC') {
                    let exactMatches = 0;
                    let m2Used = Array(unit.variantModules.length).fill(false);
                    let unmatchedM1 = [];
                    
                    for (let i = 0; i < unit.modules.length; i++) {
                        const m1 = unit.modules[i];
                        if (!m1) continue;
                        const m1Check = { ...m1, customName: '' };
                        let foundMatch = false;
                        
                        for (let j = 0; j < unit.variantModules.length; j++) {
                            if (m2Used[j]) continue;
                            const m2 = unit.variantModules[j];
                            if (!m2) continue;
                            const m2Check = { ...m2, customName: '' };
                            
                            if (JSON.stringify(m1Check) === JSON.stringify(m2Check)) {
                                exactMatches++;
                                m2Used[j] = true;
                                foundMatch = true;
                                break;
                            }
                        }
                        
                        if (!foundMatch) {
                            unmatchedM1.push(m1);
                        }
                    }
                    
                    let unmatchedM2 = [];
                    for (let j = 0; j < unit.variantModules.length; j++) {
                        if (!m2Used[j] && unit.variantModules[j]) {
                            unmatchedM2.push(unit.variantModules[j]);
                        }
                    }
                    
                    const getCat = (m) => (m.category === 'WEAPON' || m.category === 'BRAWL') ? 'WPN' : m.category;
                    const cats1 = unmatchedM1.map(getCat).sort();
                    const cats2 = unmatchedM2.map(getCat).sort();
                    
                    let categoryMatches = 0;
                    if (cats1.length === cats2.length) {
                        for (let k = 0; k < cats1.length; k++) {
                            if (cats1[k] === cats2[k]) {
                                categoryMatches++;
                            }
                        }
                    }
                    
                    if (exactMatches !== 3) {
                        errors.push(`Hired MACs must have exactly 3 identical modules between variants (Currently ${exactMatches}).`);
                    }
                    if (categoryMatches !== unmatchedM1.length) {
                        errors.push(`Hired MAC variant modules must share the same category (Weapon/Brawl or Hardware) for the remaining non-identical modules.`);
                    }
                    
                    let cost1 = calculateCost(unit, variantRules.doubleModules);
                    let cost2 = calculateCost({ ...unit, modules: unit.variantModules }, variantRules.doubleModules);
                    if (cost1 !== cost2) {
                        errors.push(`Hired MAC variants must have the same total point cost (Variant 1: ${cost1}pts, Variant 2: ${cost2}pts).`);
                    }
                }

                return errors;
            };

            const createDefaultModules = (typeId, factionId, isMerc) => {
                const typeData = UNIT_TYPES[typeId];
                if (!typeData || typeData.type === "ASSET") return [];

                const startSlots = typeData.type === "MAC" ? 6 : 1;
                const modules = [];

                if (factionId === "FIRST" && typeData.type === "MAC" && !isMerc) {
                    modules.push({
                        category: "HW",
                        range: "S",
                        type: "B",
                        power: 1,
                        subtype: "",
                        expendable: false,
                        hwName: "Seeker",
                        brawlId: "P2",
                        isSlot0: true,
                        isDouble: false,
                        customName: "",
                    });
                }

                modules.push({
                    category: "WEAPON",
                    range: "S",
                    type: "B",
                    power: 1,
                    subtype: "",
                    expendable: false,
                    hwName: "Amplifier",
                    brawlId: "P2",
                    isDouble: false,
                    customName: "",
                });

                if (typeData.type === "MAC") {
                    modules[modules.length - 1].power = typeData.maxMain;
                    for (let i = 1; i < startSlots; i++) {
                        modules.push({
                            category: "HW",
                            range: "S",
                            type: "B",
                            power: 1,
                            subtype: "",
                            expendable: false,
                            hwName: "Frame",
                            brawlId: "P2",
                            isDouble: false,
                            customName: "",
                        });
                    }
                }
                return modules;
            };

            const sanitizeUnit = (unit) => {
                return {
                    ...unit,
                    isMerc: unit.isMerc || false,
                    division: unit.division || "A",
                    pilot: unit.pilot || { name: "", type: "Standard", trick: "", isCommander: false, drill: "" },
                    perks: unit.perks || "",
                    flaws: unit.flaws || "",
                    card: unit.card || { suit: "", rank: "" },
                    count: unit.count || 1,
                    assetName: unit.assetName || REMOTE_ASSETS[0].name,
                    variantModules: unit.variantModules || null,
                };
            };

            // --- Components ---

            const ImageUpload = ({ image, onImageChange }) => {
                const fileInputRef = useRef(null);

                const handleFileChange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_SIZE = 400; // Constrain maximum dimensions
                                let width = img.width;
                                let height = img.height;

                                // Calculate new dimensions while maintaining aspect ratio
                                if (width > height && width > MAX_SIZE) {
                                    height *= MAX_SIZE / width;
                                    width = MAX_SIZE;
                                } else if (height > MAX_SIZE) {
                                    width *= MAX_SIZE / height;
                                    height = MAX_SIZE;
                                }

                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                
                                // Fill a white background to prevent transparent PNGs from turning black
                                ctx.fillStyle = "#ffffff";
                                ctx.fillRect(0, 0, width, height);
                                ctx.drawImage(img, 0, 0, width, height);
                                
                                // Export as a highly compressed JPEG (70% quality)
                                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                                onImageChange(compressedDataUrl);
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                };

                return (
                    <div className="w-full h-full">
                        <input
                            type="file"
                            ref={fileInputRef}
                            onChange={handleFileChange}
                            accept="image/*"
                            className="hidden"
                        />
                        <div
                            className={`w-full h-full min-h-[100px] flex flex-col items-center justify-center border-2 border-dashed rounded cursor-pointer transition-colors ${image ? "border-slate-300" : "border-slate-300 hover:border-blue-400 bg-slate-50"}`}
                            onClick={() => fileInputRef.current.click()}
                            title="Click to upload image"
                        >
                            {image ? (
                                <img src={image} alt="Unit" className="w-full h-full object-cover rounded" />
                            ) : (
                                <div className="text-slate-400 flex flex-col items-center gap-1">
                                    <IconCamera />
                                    <span className="text-xs uppercase font-bold text-center leading-tight">
                                        Add
                                        <br />
                                        Photo
                                    </span>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ModuleEditor = ({
                module,
                index,
                displayIndex,
                unitType,
                onChange,
                onDelete,
                onClone,
                onMoveUp,
                onMoveDown,
                isFirstMovable,
                isLastMovable,
                isMac,
                availableHardware,
                availableBrawlWeapons,
                showDoubleOption,
            }) => {
                const typeInfo = UNIT_TYPES[unitType];
                const isAu = typeInfo.type === "AU";
                const ruleText = getModuleRule(module, showDoubleOption);
                const isSlot0 = module.isSlot0;

                // Local state for the weapon code parser
                const [parseInput, setParseInput] = useState("");
                const [parseError, setParseError] = useState(false);

                // Parsing logic triggered on Enter key
                const handleParse = (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        if (!parseInput.trim()) {
                            setParseError(false);
                            return;
                        }

                        // Forgive formatting: uppercase everything and remove all spaces and hyphens
                        let val = parseInput.trim().toUpperCase().replace(/[\s-]/g, "");
                        let isDouble = module.isDouble || false;

                        // Handle the "2x" prefix for Double Modules
                        if (val.startsWith("2X")) {
                            isDouble = true;
                            val = val.substring(2);
                        }

                        // Regex for Standard Weapons: [S/L/A] + [B/P/G/M] + [1-4] + Optional combination of [X,T,J,R]
                        const weaponRegex = /^([SLA])([BPGM])([1-4])([XTJR]{0,2})$/;

                        // Regex for Brawl Weapons: [P/B/G/M] + 2 + Optional combination of [X,T,J,R]
                        const brawlRegex = /^([PBGM]2)([XTJR]{0,2})$/;

                        let weaponMatch = val.match(weaponRegex);
                        let brawlMatch = val.match(brawlRegex);

                        if (weaponMatch) {
                            let subtypeStr = weaponMatch[4] || "";
                            onChange(index, {
                                ...module,
                                category: "WEAPON",
                                isDouble: isDouble,
                                range: weaponMatch[1],
                                type: weaponMatch[2],
                                power: parseInt(weaponMatch[3]),
                                subtype: subtypeStr.replace(/X/g, ""), // Strip X to set base subtype (T, J, R)
                                expendable: subtypeStr.includes("X"), // Map X to the separate expendable boolean
                            });
                            setParseInput("");
                            setParseError(false);
                        } else if (brawlMatch) {
                            let subtypeStr = brawlMatch[2] || "";
                            onChange(index, {
                                ...module,
                                category: "BRAWL",
                                isDouble: isDouble,
                                brawlId: brawlMatch[1],
                                subtype: subtypeStr.replace(/X/g, ""),
                                expendable: subtypeStr.includes("X"),
                            });
                            setParseInput("");
                            setParseError(false);
                        } else {
                            setParseError(true); // Highlight red if invalid
                        }
                    }
                };

                return (
                    <div
                        className={`flex flex-col lg:flex-row gap-2 p-2 ${isSlot0 ? "bg-amber-50 border-amber-200" : "bg-slate-50 border-slate-200"} border rounded mb-2 items-start lg:items-center text-sm group transition-colors`}
                    >
                        <div className="flex flex-col gap-0 opacity-20 group-hover:opacity-100 transition-opacity mr-1 shrink-0">
                            <button
                                onClick={onMoveUp}
                                disabled={isFirstMovable || isSlot0}
                                className="text-slate-500 hover:text-blue-600 disabled:opacity-30 disabled:hover:text-slate-500"
                                title="Move Up"
                            >
                                <IconArrowUp />
                            </button>
                            <button
                                onClick={onMoveDown}
                                disabled={isLastMovable || isSlot0}
                                className="text-slate-500 hover:text-blue-600 disabled:opacity-30 disabled:hover:text-slate-500"
                                title="Move Down"
                            >
                                <IconArrowDown />
                            </button>
                        </div>

                        <div
                            className={`font-black w-6 flex-shrink-0 text-center ${isSlot0 ? "text-amber-600" : "text-slate-400"}`}
                        >
                            {isSlot0 ? "O" : displayIndex}
                        </div>

                        <select
                            className="p-1 border rounded bg-white w-full lg:w-auto font-sans"
                            value={module.category}
                            disabled={isSlot0}
                            onChange={(e) =>
                                onChange(index, {
                                    ...module,
                                    category: e.target.value,
                                    range: "S",
                                    type: "B",
                                    power: 1,
                                    subtype: "",
                                    expendable: false,
                                    hwName: availableHardware[0]?.name || "Frame",
                                    brawlId: "P2",
                                    customName: "",
                                })
                            }
                        >
                            {isSlot0 ? (
                                <option value="HW">Hardware</option>
                            ) : (
                                <>
                                    <option value="WEAPON">Gun</option>
                                    <option value="BRAWL">Brawl</option>
                                    <option value="HW">Hardware</option>
                                    {isMac && <option value="EMPTY">Empty</option>}
                                </>
                            )}
                        </select>

                        <div className="flex-grow w-full lg:w-auto flex flex-col gap-1 font-sans">
                            {(module.category === "WEAPON" || module.category === "BRAWL" || module.category === "HW") && (
                                <div className="flex gap-2 mb-1 w-full">
                                    <input
                                        type="text"
                                        className="p-1 border rounded flex-grow text-sm placeholder-slate-400 font-sans"
                                        placeholder={module.category === "HW" ? "Hardware Name (Optional)" : "Weapon Name (Optional)"}
                                        value={module.customName || ""}
                                        onChange={(e) => onChange(index, { ...module, customName: e.target.value })}
                                    />
                                    {(module.category === "WEAPON" || module.category === "BRAWL") && (
                                        <input
                                            type="text"
                                            className={`p-1 border rounded w-1/3 min-w-[120px] text-sm placeholder-slate-400 font-sans transition-colors ${parseError ? "border-red-500 bg-red-50 text-red-700 outline-red-500" : "border-slate-200"}`}
                                            placeholder="Code (e.g. SP2-TX)"
                                            value={parseInput}
                                            onChange={(e) => {
                                                setParseInput(e.target.value);
                                                setParseError(false);
                                            }}
                                            onKeyDown={handleParse}
                                            title="Type weapon code and press Enter"
                                        />
                                    )}
                                </div>
                            )}

                            {module.category === "WEAPON" && (
                                <div className="flex flex-wrap gap-1">
                                    <select
                                        className="p-1 border rounded flex-grow"
                                        value={module.range}
                                        onChange={(e) => onChange(index, { ...module, range: e.target.value })}
                                    >
                                        {WEAPON_RANGES.map((r) => (
                                            <option key={r.id} value={r.id}>
                                                {r.name}
                                            </option>
                                        ))}
                                    </select>
                                    <select
                                        className="p-1 border rounded flex-grow"
                                        value={module.type}
                                        onChange={(e) => onChange(index, { ...module, type: e.target.value })}
                                    >
                                        {WEAPON_TYPES.map((t) => (
                                            <option key={t.id} value={t.id}>
                                                {t.name}
                                            </option>
                                        ))}
                                    </select>
                                    <select
                                        className="p-1 border rounded w-16"
                                        value={module.power}
                                        onChange={(e) =>
                                            onChange(index, { ...module, power: parseInt(e.target.value) })
                                        }
                                    >
                                        {[1, 2, 3, 4].map((p) => (
                                            <option key={p} value={p}>
                                                Pwr {p}
                                            </option>
                                        ))}
                                    </select>
                                    <select
                                        className="p-1 border rounded flex-grow"
                                        value={module.subtype}
                                        onChange={(e) => onChange(index, { ...module, subtype: e.target.value })}
                                    >
                                        {WEAPON_SUBTYPES.map((s) => (
                                            <option key={s.id} value={s.id}>
                                                {s.name}
                                            </option>
                                        ))}
                                    </select>
                                    <label className="flex items-center gap-2 cursor-pointer ml-1 pr-2">
                                        <input
                                            type="checkbox"
                                            className="accent-blue-600 w-4 h-4"
                                            checked={module.expendable || false}
                                            onChange={(e) =>
                                                onChange(index, { ...module, expendable: e.target.checked })
                                            }
                                        />
                                        <span className="font-bold text-slate-600">Expendable</span>
                                    </label>
                                </div>
                            )}

                            {module.category === "BRAWL" && (
                                <div className="flex gap-1 items-center">
                                    <select
                                        className="p-1 border rounded w-full"
                                        value={module.brawlId}
                                        onChange={(e) => onChange(index, { ...module, brawlId: e.target.value })}
                                    >
                                        {availableBrawlWeapons.map((b) => (
                                            <option key={b.id} value={b.id}>
                                                {b.name}
                                            </option>
                                        ))}
                                    </select>
                                    <select
                                        className="p-1 border rounded w-1/3"
                                        value={module.subtype || ""}
                                        onChange={(e) => onChange(index, { ...module, subtype: e.target.value })}
                                    >
                                        {WEAPON_SUBTYPES.map((s) => (
                                            <option key={s.id} value={s.id}>
                                                {s.name || "No Type"}
                                            </option>
                                        ))}
                                    </select>
                                    <label className="flex items-center gap-2 cursor-pointer ml-1 pr-2 shrink-0">
                                        <input
                                            type="checkbox"
                                            className="accent-blue-600 w-4 h-4"
                                            checked={module.expendable || false}
                                            onChange={(e) =>
                                                onChange(index, { ...module, expendable: e.target.checked })
                                            }
                                        />
                                        <span className="font-bold text-slate-600">Expendable</span>
                                    </label>
                                </div>
                            )}

                            {module.category === "HW" && (
                                <select
                                    className="p-1 border rounded w-full"
                                    value={module.hwName}
                                    onChange={(e) => onChange(index, { ...module, hwName: e.target.value })}
                                >
                                    {availableHardware.map((h) => (
                                        <option key={h.name} value={h.name}>
                                            {h.name}
                                        </option>
                                    ))}
                                </select>
                            )}

                            {module.category === "EMPTY" && <div className="text-slate-400 italic p-1">Empty Slot</div>}
                        </div>

                        <div className="w-full lg:w-48 shrink-0 font-sans">
                            {ruleText && (
                                <div className="text-xs text-slate-500 bg-white p-1.5 rounded border border-slate-200 leading-tight h-full flex items-center">
                                    {ruleText}
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-2 min-w-[60px] justify-end ml-auto lg:ml-0 opacity-50 group-hover:opacity-100 transition-opacity font-sans">
                            {module.category === "WEAPON" && (
                                <span className="font-mono font-bold text-blue-600 mr-2">
                                    {generateWeaponCode(module, showDoubleOption)}
                                </span>
                            )}
                            {module.category === "BRAWL" && (
                                <span className="font-mono font-bold text-blue-600 mr-2">
                                    {generateBrawlCode(module, showDoubleOption)}
                                </span>
                            )}

                            {showDoubleOption && !isSlot0 && module.category !== "EMPTY" && (
                                <label className="flex items-center cursor-pointer mr-2" title="Double Module (+1pt)">
                                    <span className="text-xs font-bold mr-1 text-slate-500">2x</span>
                                    <input
                                        type="checkbox"
                                        checked={module.isDouble || false}
                                        onChange={(e) => onChange(index, { ...module, isDouble: e.target.checked })}
                                    />
                                </label>
                            )}

                            {!isSlot0 && (
                                <button
                                    onClick={() => onClone(index)}
                                    className="text-slate-400 hover:text-blue-600"
                                    title="Clone to next empty slot"
                                >
                                    <IconClone />
                                </button>
                            )}

                            {isAu && (
                                <button
                                    onClick={() => onDelete(index)}
                                    className="text-red-400 hover:text-red-600"
                                    title="Delete Slot"
                                >
                                    <IconTrash />
                                </button>
                            )}
                            {isSlot0 && <span className="text-amber-500 font-bold text-xs uppercase">O-MOD</span>}
                        </div>
                    </div>
                );
            };

            const MACBuilder = () => {
                const [forceName, setForceName] = useState("New Force");
                const [factionId, setFactionId] = useState("NONE");
                const [units, setUnits] = useState([]);
                const [isPrintMode, setIsPrintMode] = useState(false);
                const [showHelp, setShowHelp] = useState(false);
                
                const [hitStates, setHitStates] = useState({});
                const [destroyedStates, setDestroyedStates] = useState({});
                const [depletedStates, setDepletedStates] = useState({});
                const [damageStates, setDamageStates] = useState({});

                // Workspace Libraries
                const [forceLibrary, setForceLibrary] = useState([]);
                const [unitLibrary, setUnitLibrary] = useState([]);
                const [isForceLibraryOpen, setIsForceLibraryOpen] = useState(false);
                const [isUnitLibraryOpen, setIsUnitLibraryOpen] = useState(false);
                const [selectedLibraryUnitIds, setSelectedLibraryUnitIds] = useState([]);
                const [isLoaded, setIsLoaded] = useState(false);
                const [storageError, setStorageError] = useState(false);

                // Feature Flags

                // Feature Flags
                const [variantRules, setVariantRules] = useState({
                    remoteAssets: false,
                    hiredMercs: false,
                    perksFlaws: false,
                    pilots: false,
                    doubleModules: false,
                    hideWarnings: false,
                });

                const importWorkspaceRef = useRef(null);
                const mergeWorkspaceRef = useRef(null);

                useEffect(() => {
                    const savedData = localStorage.getItem('mac_attack_autosave');
                    if (savedData) {
                        try {
                            const data = JSON.parse(savedData);
                            if (data.activeForce) {
                                setForceName(data.activeForce.forceName || "New Force");
                                setFactionId(data.activeForce.factionId || "NONE");
                                setVariantRules(data.activeForce.variantRules || {
                                    remoteAssets: false, hiredMercs: false, perksFlaws: false, pilots: false, doubleModules: false, hideWarnings: false
                                });
                                setHitStates(data.activeForce.hitStates || {});
                                setDestroyedStates(data.activeForce.destroyedStates || {});
                                setDepletedStates(data.activeForce.depletedStates || {});
                                setDamageStates(data.activeForce.damageStates || {});
                                setUnits(data.activeForce.units && data.activeForce.units.length > 0 ? data.activeForce.units.map(sanitizeUnit) : []);
                            } else {
                                // Fallback for previous save format
                                if (data.forceName) setForceName(data.forceName);
                                if (data.factionId) setFactionId(data.factionId);
                                if (data.variantRules) setVariantRules(data.variantRules);
                                if (data.hitStates) setHitStates(data.hitStates);
                                if (data.destroyedStates) setDestroyedStates(data.destroyedStates);
                                if (data.depletedStates) setDepletedStates(data.depletedStates);
                                if (data.damageStates) setDamageStates(data.damageStates);
                                if (data.units && data.units.length > 0) setUnits(data.units.map(sanitizeUnit));
                            }

                            if (data.forceLibrary) setForceLibrary(data.forceLibrary);
                            if (data.unitLibrary) setUnitLibrary(data.unitLibrary);

                        } catch (e) {
                            console.warn("Could not parse autosave data.", e);
                        }
                    }
                    setIsLoaded(true);
                }, []);

                useEffect(() => {
                    // Ensure at least one unit exists if loaded but empty
                    if (isLoaded && units.length === 0) {
                        addUnit("MAC2");
                    }
                }, [isLoaded, units]);

                useEffect(() => {
                    if (isLoaded) {
                        const dataToSave = { 
                            activeForce: {
                                forceName, 
                                factionId, 
                                units, 
                                variantRules,
                                hitStates,
                                destroyedStates,
                                depletedStates,
                                damageStates
                            },
                            forceLibrary,
                            unitLibrary
                        };
                        try {
                            localStorage.setItem('mac_attack_autosave', JSON.stringify(dataToSave));
                            setStorageError(false);
                        } catch (error) {
                            console.error("Storage error:", error);
                            setStorageError(true);
                        }
                    }
                }, [forceName, factionId, units, variantRules, hitStates, destroyedStates, depletedStates, damageStates, forceLibrary, unitLibrary, isLoaded]);
                
                const toggleHit = (unitId, modIndex) => {
                    setHitStates((prev) => {
                        const unitHits = prev[unitId] || {};
                        const newHit = !unitHits[modIndex];
                        return { ...prev, [unitId]: { ...unitHits, [modIndex]: newHit } };
                    });
                };

                const toggleDestroyed = (unitId, modIndex, isDouble) => {
                    setDestroyedStates((prev) => {
                        const unitDestroyed = prev[unitId] || {};
                        // Catch legacy boolean states from old saves
                        let currentCount = unitDestroyed[modIndex];
                        if (typeof currentCount === 'boolean') currentCount = currentCount ? 1 : 0;
                        if (!currentCount) currentCount = 0;
                        
                        const maxCount = isDouble ? 2 : 1;
                        const newCount = (currentCount + 1) % (maxCount + 1);
                        return { ...prev, [unitId]: { ...unitDestroyed, [modIndex]: newCount } };
                    });
                };

                const toggleDepleted = (unitId, modIndex, isDouble) => {
                    setDepletedStates((prev) => {
                        const unitDepleted = prev[unitId] || {};
                        const currentCount = unitDepleted[modIndex] || 0;
                        const maxCount = isDouble ? 2 : 1;
                        const newCount = (currentCount + 1) % (maxCount + 1);
                        return { ...prev, [unitId]: { ...unitDepleted, [modIndex]: newCount } };
                    });
                };

                const toggleInternalDamage = (unitId, damageIndex) => {
                    setDamageStates((prev) => {
                        const unitDmg = prev[unitId] || {};
                        const newDmg = !unitDmg[damageIndex];
                        return { ...prev, [unitId]: { ...unitDmg, [damageIndex]: newDmg } };
                    });
                };

                const getNextAvailableRank = (currentUnits) => {
                    const usedRanks = currentUnits.map((u) => u.card?.rank).filter(Boolean);
                    return RANKS.find((r) => !usedRanks.includes(r)) || "";
                };

                const getGlobalSuit = (currentUnits) => {
                    return currentUnits.find((u) => u.card?.suit)?.card?.suit || "";
                };

                const addUnit = (typeId = "MAC2") => {
                    setUnits((prevUnits) => {
                        const nextRank = getNextAvailableRank(prevUnits);
                        const globalSuit = getGlobalSuit(prevUnits);
                        const countStr = prevUnits.length + 1;
                        const nameBase = typeId === "REMOTE" ? "Asset" : "Unit";

                        const newUnit = {
                            id: Date.now() + Math.random(),
                            name: `${nameBase} ${countStr}`,
                            type: typeId,
                            division: "A",
                            assetName: REMOTE_ASSETS[0].name,
                            image: null,
                            isMerc: false,
                            pilot: { name: "", type: "Standard", trick: "", isCommander: false, drill: "" },
                            perks: "",
                            flaws: "",
                            card: { suit: globalSuit, rank: nextRank },
                            modules: createDefaultModules(typeId, factionId, false),
                            variantModules: null,
                            count: 1,
                        };
                        return [...prevUnits, newUnit];
                    });
                };

                const updateUnit = (id, field, value, nestedField) => {
                    setUnits((prevUnits) => {
                        // Sync card suits across all units
                        if (field === "card" && nestedField === "suit") {
                            return prevUnits.map((u) => ({
                                ...u,
                                card: { ...u.card, suit: value },
                            }));
                        }

                        if (field === "pilot" && nestedField === "isCommander" && value === true) {
                            return prevUnits.map((u) => {
                                if (u.id === id) return { ...u, pilot: { ...u.pilot, isCommander: true } };
                                return { ...u, pilot: { ...u.pilot, isCommander: false } };
                            });
                        }

                        return prevUnits.map((u) => {
                            if (u.id !== id) return u;

                            if (field === "type") {
                                const defaultAsset = u.assetName || REMOTE_ASSETS[0].name;
                                const newUnit = {
                                    ...u,
                                    type: value,
                                    assetName: defaultAsset,
                                    count: 1,
                                    name: value === "REMOTE" ? defaultAsset : u.name,
                                };

                                // Do not reset modules if we only change between MAC classes
                                const oldTypeInfo = UNIT_TYPES[u.type];
                                const newTypeInfo = UNIT_TYPES[value];
                                if (oldTypeInfo.type !== newTypeInfo.type || newTypeInfo.type !== "MAC") {
                                    newUnit.modules = createDefaultModules(value, factionId, u.isMerc);
                                    if (newUnit.isMerc) newUnit.variantModules = JSON.parse(JSON.stringify(newUnit.modules));
                                }

                                return sanitizeUnit(newUnit);
                            }

                            if (field === "pilot") return { ...u, pilot: { ...u.pilot, [nestedField]: value } };
                            if (field === "card") return { ...u, card: { ...u.card, [nestedField]: value } };

                            if (field === "assetName") {
                                return { ...u, assetName: value, name: value };
                            }

                            if (field === "isMerc") {
                                const isNowMerc = value;
                                let newModules = u.modules ? [...u.modules] : [];

                                if (isNowMerc) {
                                    newModules = newModules.filter((m) => !m.isSlot0);
                                } else if (factionId === "FIRST" && UNIT_TYPES[u.type].type === "MAC") {
                                    if (!newModules.some((m) => m.isSlot0)) {
                                        newModules.unshift({
                                            category: "HW",
                                            range: "S",
                                            type: "B",
                                            power: 1,
                                            subtype: "",
                                            expendable: false,
                                            hwName: "Seeker",
                                            brawlId: "P2",
                                            isSlot0: true,
                                            customName: "",
                                        });
                                    }
                                }
                                
                                let newVariantModules = u.variantModules;
                                if (isNowMerc && !newVariantModules) {
                                    newVariantModules = JSON.parse(JSON.stringify(newModules));
                                }
                                
                                return { ...u, isMerc: isNowMerc, modules: newModules, variantModules: newVariantModules };
                            }

                            return { ...u, [field]: value };
                        });
                    });
                };

                const updateModule = (unitId, modIndex, newModule, isVariant = false) => {
                    setUnits(
                        units.map((u) => {
                            if (u.id !== unitId) return u;
                            if (isVariant) {
                                const newVariants = [...u.variantModules];
                                newVariants[modIndex] = newModule;
                                return { ...u, variantModules: newVariants };
                            }
                            const newModules = [...u.modules];
                            newModules[modIndex] = newModule;
                            return { ...u, modules: newModules };
                        })
                    );
                };

                const cloneModule = (unitId, sourceIndex, isVariant = false) => {
                    setUnits(
                        units.map((u) => {
                            if (u.id !== unitId) return u;
                            const targetArray = isVariant ? u.variantModules : u.modules;
                            const sourceMod = targetArray[sourceIndex];
                            if (sourceMod.isSlot0) return u;

                            const newModules = [...targetArray];
                            if (UNIT_TYPES[u.type].type === "AU") {
                                return isVariant ? { ...u, variantModules: [...newModules, { ...sourceMod }] } : { ...u, modules: [...newModules, { ...sourceMod }] };
                            }
                            for (let i = 0; i < newModules.length; i++) {
                                if (
                                    i !== sourceIndex &&
                                    !newModules[i].isSlot0 &&
                                    (newModules[i].category === "EMPTY" || newModules[i].hwName === "Frame")
                                ) {
                                    newModules[i] = { ...sourceMod, isSlot0: false };
                                    break;
                                }
                            }
                            return isVariant ? { ...u, variantModules: newModules } : { ...u, modules: newModules };
                        })
                    );
                };

                const moveModule = (unitId, index, direction, isVariant = false) => {
                    setUnits(
                        units.map((u) => {
                            if (u.id !== unitId) return u;
                            const newModules = isVariant ? [...u.variantModules] : [...u.modules];
                            if (direction === -1 && index > 0) {
                                if (newModules[index - 1].isSlot0) return u;
                                [newModules[index - 1], newModules[index]] = [newModules[index], newModules[index - 1]];
                            } else if (direction === 1 && index < newModules.length - 1) {
                                [newModules[index + 1], newModules[index]] = [newModules[index], newModules[index + 1]];
                            }
                            return isVariant ? { ...u, variantModules: newModules } : { ...u, modules: newModules };
                        })
                    );
                };

                const addModuleSlot = (unitId) => {
                    setUnits(
                        units.map((u) => {
                            if (u.id !== unitId) return u;
                            return {
                                ...u,
                                modules: [
                                    ...u.modules,
                                    {
                                        category: "HW",
                                        range: "S",
                                        type: "B",
                                        power: 1,
                                        subtype: "",
                                        expendable: false,
                                        hwName: "Armour",
                                        brawlId: "P2",
                                        isDouble: false,
                                        customName: "",
                                    },
                                ],
                            };
                        })
                    );
                };

                const removeModuleSlot = (unitId, index) => {
                    setUnits(
                        units.map((u) => {
                            if (u.id !== unitId) return u;
                            const newModules = u.modules.filter((_, i) => i !== index);
                            return { ...u, modules: newModules };
                        })
                    );
                };

                const removeUnit = (id) => {
                    setUnits(units.filter((u) => u.id !== id));
                };

                const duplicateUnit = (unit) => {
                    setUnits((prevUnits) => {
                        const nextRank = getNextAvailableRank(prevUnits);
                        const globalSuit = getGlobalSuit(prevUnits);

                        const newUnit = sanitizeUnit({
                            ...unit,
                            id: Date.now() + Math.random(),
                            name: `${unit.name} (Copy)`,
                            pilot: { ...unit.pilot, isCommander: false },
                            card: { suit: globalSuit, rank: nextRank },
                            modules: unit.modules ? JSON.parse(JSON.stringify(unit.modules)) : [],
                            variantModules: unit.variantModules ? JSON.parse(JSON.stringify(unit.variantModules)) : null,
                        });
                        return [...prevUnits, newUnit];
                    });
                };

                const moveUnit = (index, direction) => {
                    if (direction === -1 && index > 0) {
                        const newUnits = [...units];
                        [newUnits[index - 1], newUnits[index]] = [newUnits[index], newUnits[index - 1]];
                        setUnits(newUnits);
                    } else if (direction === 1 && index < units.length - 1) {
                        const newUnits = [...units];
                        [newUnits[index + 1], newUnits[index]] = [newUnits[index], newUnits[index + 1]];
                        setUnits(newUnits);
                    }
                };

                const sortUnitsByDivision = () => {
                    setUnits(
                        [...units].sort((a, b) => {
                            const divA = a.division || "A";
                            const divB = b.division || "A";
                            if (divA < divB) return -1;
                            if (divA > divB) return 1;
                            return 0;
                        })
                    );
                };

                const handleFactionChange = (e) => {
                    const newFaction = e.target.value;
                    setFactionId(newFaction);

                    setUnits((prevUnits) =>
                        prevUnits.map((u) => {
                            const typeInfo = UNIT_TYPES[u.type];
                            if (!typeInfo || typeInfo.type !== "MAC") return u;
                            if (u.isMerc) return u;

                            let newModules = [...u.modules];
                            if (newFaction === "FIRST") {
                                if (!newModules.some((m) => m.isSlot0)) {
                                    newModules.unshift({
                                        category: "HW",
                                        range: "S",
                                        type: "B",
                                        power: 1,
                                        subtype: "",
                                        expendable: false,
                                        hwName: "Seeker",
                                        brawlId: "P2",
                                        isSlot0: true,
                                        isDouble: false,
                                        customName: "",
                                    });
                                }
                            } else {
                                newModules = newModules.filter((m) => !m.isSlot0);
                            }
                            return { ...u, modules: newModules };
                        })
                    );
                };

                const toggleVariantRule = (ruleKey) => {
                    setVariantRules((prev) => ({ ...prev, [ruleKey]: !prev[ruleKey] }));
                };

                const handleNewForce = () => {
                    if (window.confirm("Are you sure you want to start a new force? All unsaved progress will be lost.")) {
                        setForceName("New Force");
                        setFactionId("NONE");
                        
                        const newUnit = {
                            id: Date.now() + Math.random(),
                            name: "Unit 1",
                            type: "MAC2",
                            division: "A",
                            assetName: REMOTE_ASSETS[0].name,
                            image: null,
                            isMerc: false,
                            pilot: { name: "", type: "Standard", trick: "", isCommander: false, drill: "" },
                            perks: "",
                            flaws: "",
                            card: { suit: "", rank: "" },
                            modules: createDefaultModules("MAC2", "NONE", false),
                            variantModules: null,
                            count: 1,
                        };
                        
                        setUnits([newUnit]);
                        setHitStates({});
                        setDestroyedStates({});
                        setDepletedStates({});
                        setDamageStates({});
                    }
                };

                const saveForceToLibrary = () => {
                    const forceData = { 
                        forceName, 
                        factionId, 
                        units, 
                        variantRules, 
                        hitStates, 
                        destroyedStates, 
                        depletedStates, 
                        damageStates,
                        timestamp: Date.now()
                    };
                    const existingIndex = forceLibrary.findIndex(f => f.forceName === forceName);
                    
                    if (existingIndex >= 0) {
                        if (window.confirm(`Overwrite existing force "${forceName}" in the library?`)) {
                            const newLib = [...forceLibrary];
                            newLib[existingIndex] = forceData;
                            setForceLibrary(newLib);
                            alert(`Force "${forceName}" updated.`);
                        }
                    } else {
                        setForceLibrary([...forceLibrary, forceData]);
                        alert(`Force "${forceName}" saved to library.`);
                    }
                };

                const saveUnitToLibrary = (unit) => {
                    const unitName = prompt("Enter a name for this saved unit:", unit.name);
                    if (!unitName) return;
                    
                    const unitData = { ...unit, name: unitName, id: Date.now() + Math.random() };
                    const existingIndex = unitLibrary.findIndex(u => u.name === unitName);
                    
                    if (existingIndex >= 0) {
                        if (window.confirm(`Overwrite existing unit "${unitName}" in the library?`)) {
                            const newLib = [...unitLibrary];
                            newLib[existingIndex] = unitData;
                            setUnitLibrary(newLib);
                            alert(`Unit "${unitName}" updated.`);
                        }
                    } else {
                        setUnitLibrary([...unitLibrary, unitData]);
                        alert(`Unit "${unitName}" saved to library.`);
                    }
                };

                const exportWorkspace = () => {
                    const workspace = {
                        macAttackWorkspace: true, // Retained for backwards compatibility with older save files
                        activeForce: { forceName, factionId, units, variantRules, hitStates, destroyedStates, depletedStates, damageStates },
                        forceLibrary,
                        unitLibrary
                    };
                    const blob = new Blob([JSON.stringify(workspace, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = `mac_attack_library_${new Date().toISOString().slice(0,10)}.json`;
                    link.click();
                };

                const importWorkspace = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (data.macAttackWorkspace) {
                                if (data.activeForce) {
                                    setForceName(data.activeForce.forceName || "New Force");
                                    setFactionId(data.activeForce.factionId || "NONE");
                                    setVariantRules(data.activeForce.variantRules || { remoteAssets: false, hiredMercs: false, perksFlaws: false, pilots: false, doubleModules: false });
                                    setUnits(data.activeForce.units ? data.activeForce.units.map(sanitizeUnit) : []);
                                    setHitStates(data.activeForce.hitStates || {});
                                    setDestroyedStates(data.activeForce.destroyedStates || {});
                                    setDepletedStates(data.activeForce.depletedStates || {});
                                    setDamageStates(data.activeForce.damageStates || {});
                                }
                                if (data.forceLibrary) setForceLibrary(data.forceLibrary);
                                if (data.unitLibrary) setUnitLibrary(data.unitLibrary);
                                alert("Library loaded successfully!");
                            } else {
                                alert("Invalid library file. Please select a valid MAC Attack Library.");
                            }
                        } catch(err) {
                            alert("Error loading file.");
                        }
                    };
                    reader.readAsText(file);
                    e.target.value = null;
                };

                const mergeWorkspace = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.macAttackWorkspace) {
                                let forcesAdded = 0;
                                let unitsAdded = 0;
                                if (data.forceLibrary && data.forceLibrary.length > 0) {
                                    setForceLibrary(prev => [...prev, ...data.forceLibrary]);
                                    forcesAdded = data.forceLibrary.length;
                                }
                                if (data.unitLibrary && data.unitLibrary.length > 0) {
                                    setUnitLibrary(prev => [...prev, ...data.unitLibrary]);
                                    unitsAdded = data.unitLibrary.length;
                                }
                                alert(`Merged ${forcesAdded} forces and ${unitsAdded} units into your library.`);
                            } else {
                                alert("Invalid library file. Please select a valid MAC Attack Library.");
                            }
                        } catch(err) {
                            alert("Error reading file.");
                        }
                    };
                    reader.readAsText(file);
                    e.target.value = null;
                };

                const handleWipeLibrary = () => {
                    if (window.confirm("Are you sure you want to completely wipe your Library? This will delete all saved forces and units. This action cannot be undone.")) {
                        setForceLibrary([]);
                        setUnitLibrary([]);
                        alert("Library has been completely wiped.");
                    }
                };

                const totalCost = units.reduce((sum, u) => sum + calculateCost(u, variantRules.doubleModules), 0);
                const selectedFaction = FACTIONS.find((f) => f.id === factionId) || FACTIONS[0];

                // Force Level Validation
                const totalMacs = units.filter((u) => UNIT_TYPES[u.type]?.type === "MAC").length;
                const totalAus = units.filter((u) => UNIT_TYPES[u.type]?.type === "AU").length;
                const totalAssets = units
                    .filter((u) => UNIT_TYPES[u.type]?.type === "ASSET")
                    .reduce((sum, u) => sum + (u.count || 1), 0);

                const forceErrors = [];
                if (totalMacs > 0 && totalMacs < 3) forceErrors.push("A legal force requires at least 3 MACs.");
                if (totalAus > totalMacs)
                    forceErrors.push(
                        `Too many auxiliary formations. Max 1 AU formation per MAC (MACs: ${totalMacs}, AU Formations: ${totalAus}).`
                    );
                if (variantRules.remoteAssets && totalAssets > totalMacs) {
                    forceErrors.push(
                        `Too many Remote Assets. Limit 1 per MAC (MACs: ${totalMacs}, Assets: ${totalAssets}).`
                    );
                }

                // Division Level Validation
                const deployableUnits = units.filter((u) => UNIT_TYPES[u.type]?.type !== "ASSET");
                const totalDeployable = deployableUnits.length;
                const divCounts = { A: 0, B: 0, C: 0 };
                const divMacs = { A: 0, B: 0, C: 0 };
                let commanderDiv = null;
                let commanderCount = 0;
                const unitNameByCard = new Map();

                deployableUnits.forEach((u) => {
                    const div = u.division || "A";
                    divCounts[div] = (divCounts[div] || 0) + 1;
                    if (UNIT_TYPES[u.type]?.type === "MAC") {
                        divMacs[div] = (divMacs[div] || 0) + 1;
                    }
                    if (u.pilot?.isCommander) {
                        commanderCount++;
                        commanderDiv = div;
                        if (UNIT_TYPES[u.type]?.type !== "MAC") {
                            forceErrors.push(
                                `Only a MAC can be designated as the force commander (${u.name} is not a MAC).`
                            );
                        }
                    }
                    if (u.card && u.card.rank && u.card.suit) {
                        const card = `${u.card.rank}-${u.card.suit}`;
                        if (unitNameByCard.has(card)) {
                            forceErrors.push(`Units ${unitNameByCard.get(card)} and ${u.name} have the same card.`);
                        } else {
                            unitNameByCard.set(card, u.name);
                        }
                    }
                });

                if (totalDeployable > 0) {
                    ["A", "B", "C"].forEach((div) => {
                        if (divCounts[div] > totalDeployable / 2) {
                            forceErrors.push(
                                `Division ${div} contains more than half of the force's total units (${divCounts[div]}/${totalDeployable}).`
                            );
                        }
                        if (divMacs[div] === 0) {
                            forceErrors.push(`Division ${div} must contain at least one MAC.`);
                        }
                    });
                }

                if (totalMacs > 0) {
                    if (commanderCount === 0) {
                        forceErrors.push("The force must specify exactly one MAC as the Commander.");
                    } else if (commanderCount > 1) {
                        forceErrors.push(`The force can only have one Commander (currently has ${commanderCount}).`);
                    }
                }

                if (commanderDiv && commanderDiv !== "A") {
                    forceErrors.push(`The Commander must be in Division A (currently in Div ${commanderDiv}).`);
                }

                const renderForceLibraryModal = () => {
                    if (!isForceLibraryOpen) return null;
                    const sortedForces = [...forceLibrary].sort((a, b) => a.forceName.localeCompare(b.forceName));
