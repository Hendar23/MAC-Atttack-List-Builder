                                                                    className="p-1.5 border rounded w-32"
                                                                    value={unit.pilot?.trick || ""}
                                                                    onChange={(e) =>
                                                                        updateUnit(
                                                                            unit.id,
                                                                            "pilot",
                                                                            e.target.value,
                                                                            "trick"
                                                                        )
                                                                    }
                                                                >
                                                                    <option value="">No Trick</option>
                                                                    {PILOT_TRICKS.map((t) => (
                                                                        <option key={t.name} value={t.name}>
                                                                            {t.name}
                                                                        </option>
                                                                    ))}
                                                                </select>
                                                            )}
                                                            {unit.pilot?.isCommander && (
                                                                <select
                                                                    className="p-1.5 border rounded w-32"
                                                                    value={unit.pilot?.drill || ""}
                                                                    onChange={(e) =>
                                                                        updateUnit(
                                                                            unit.id,
                                                                            "pilot",
                                                                            e.target.value,
                                                                            "drill"
                                                                        )
                                                                    }
                                                                >
                                                                    <option value="">No Drill</option>
                                                                    {COMMAND_DRILLS.map((d) => (
                                                                        <option key={d.name} value={d.name}>
                                                                            {d.name}
                                                                        </option>
                                                                    ))}
                                                                </select>
                                                            )}
                                                        </>
                                                    )}
                                                    {variantRules.perksFlaws && (
                                                        <>
                                                            <select
                                                                className="p-1.5 border rounded w-32"
                                                                value={unit.perks || ""}
                                                                onChange={(e) =>
                                                                    updateUnit(unit.id, "perks", e.target.value)
                                                                }
                                                            >
                                                                <option value="">No Perk</option>
                                                                {PERKS.map((p) => (
                                                                    <option key={p.name} value={p.name}>
                                                                        {p.name}
                                                                    </option>
                                                                ))}
                                                            </select>
                                                            <select
                                                                className="p-1.5 border rounded w-32"
                                                                value={unit.flaws || ""}
                                                                onChange={(e) =>
                                                                    updateUnit(unit.id, "flaws", e.target.value)
                                                                }
                                                            >
                                                                <option value="">No Flaw</option>
                                                                {FLAWS.map((f) => (
                                                                    <option key={f.name} value={f.name}>
                                                                        {f.name}
                                                                    </option>
                                                                ))}
                                                            </select>
                                                        </>
                                                    )}
                                                </div>
                                            )}

                                        {!variantRules.hideWarnings && errors.length > 0 && (
                                            <div className="bg-red-50 text-red-600 p-3 text-sm flex items-center gap-2 border-b border-red-100 font-sans">
                                                <IconAlert />
                                                <div className="flex flex-col">
                                                    {errors.map((e, i) => (
                                                        <span key={i}>{e}</span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {isAsset ? (
                                            <div className="p-6 bg-white font-sans">
                                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                                                    Select Remote Asset
                                                </label>
                                                <select
                                                    className="w-full p-2 border border-slate-300 rounded font-bold text-slate-700 bg-slate-50 mb-3"
                                                    value={unit.assetName}
                                                    onChange={(e) => updateUnit(unit.id, "assetName", e.target.value)}
                                                >
                                                    {REMOTE_ASSETS.map((a) => (
                                                        <option key={a.name} value={a.name}>
                                                            {a.name} ({a.cost} pts)
                                                        </option>
                                                    ))}
                                                </select>
                                                <div className="text-sm text-slate-600 italic p-3 bg-blue-50 border border-blue-100 rounded">
                                                    {REMOTE_ASSETS.find((a) => a.name === unit.assetName)?.rule}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="p-4">
                                                {unit.isMerc && variantRules.hiredMercs && (
                                                    <div className="bg-slate-200 text-slate-700 font-bold px-4 py-2 uppercase text-xs mb-2 border border-slate-300 rounded-t">
                                                        Variant 1 (Primary)
                                                    </div>
                                                )}
                                                {unit.modules &&
                                                    unit.modules.map((mod, i) => {
                                                        const displayIndex = mod.isSlot0 ? "O" : slotCounter++;
                                                        const isFirstMovable =
                                                            i === 0 || (unit.modules[0].isSlot0 && i === 1);
                                                        const isLastMovable = i === unit.modules.length - 1;
                                                        return (
                                                            <ModuleEditor
                                                                key={`m-${i}`}
                                                                index={i}
                                                                displayIndex={displayIndex}
                                                                module={mod}
                                                                unitType={unit.type}
                                                                isMac={isMac}
                                                                availableHardware={availableHW}
                                                                availableBrawlWeapons={availableBrawl}
                                                                showDoubleOption={variantRules.doubleModules}
                                                                isFirstMovable={isFirstMovable}
                                                                isLastMovable={isLastMovable}
                                                                onChange={(idx, newMod) =>
                                                                    updateModule(unit.id, idx, newMod, false)
                                                                }
                                                                onDelete={(idx) => removeModuleSlot(unit.id, idx)}
                                                                onClone={(idx) => cloneModule(unit.id, idx, false)}
                                                                onMoveUp={() => moveModule(unit.id, i, -1, false)}
                                                                onMoveDown={() => moveModule(unit.id, i, 1, false)}
                                                            />
                                                        );
                                                    })}
                                                    
                                                {unit.isMerc && variantRules.hiredMercs && unit.variantModules && (
                                                    <>
                                                        <div className="bg-slate-200 text-slate-700 font-bold px-4 py-2 uppercase text-xs mt-6 mb-2 border border-slate-300 rounded-t">
                                                            Variant 2
                                                        </div>
                                                        {unit.variantModules.map((mod, i) => {
                                                            let vSlotCounter = unit.variantModules[0]?.isSlot0 ? 0 : 1;
                                                            for (let v = 0; v < i; v++) if (!unit.variantModules[v].isSlot0) vSlotCounter++;
                                                            const displayIndex = mod.isSlot0 ? "O" : vSlotCounter;
                                                            const isFirstMovable = i === 0 || (unit.variantModules[0].isSlot0 && i === 1);
                                                            const isLastMovable = i === unit.variantModules.length - 1;
                                                            return (
                                                                <ModuleEditor
                                                                    key={`v-${i}`}
                                                                    index={i}
                                                                    displayIndex={displayIndex}
                                                                    module={mod}
                                                                    unitType={unit.type}
                                                                    isMac={isMac}
                                                                    availableHardware={availableHW}
                                                                    availableBrawlWeapons={availableBrawl}
                                                                    showDoubleOption={variantRules.doubleModules}
                                                                    isFirstMovable={isFirstMovable}
                                                                    isLastMovable={isLastMovable}
                                                                    onChange={(idx, newMod) =>
                                                                        updateModule(unit.id, idx, newMod, true)
                                                                    }
                                                                    onDelete={() => {}} // Slots cannot be deleted on hired macs
                                                                    onClone={(idx) => cloneModule(unit.id, idx, true)}
                                                                    onMoveUp={() => moveModule(unit.id, i, -1, true)}
                                                                    onMoveDown={() => moveModule(unit.id, i, 1, true)}
                                                                />
                                                            );
                                                        })}
                                                    </>
                                                )}
                                                
                                                {!isMac && (
                                                    <button
                                                        onClick={() => addModuleSlot(unit.id)}
                                                        className="w-full py-2 border-2 border-dashed border-slate-200 text-slate-400 rounded hover:border-blue-300 hover:text-blue-500 flex justify-center items-center gap-2 transition-colors text-sm font-bold mt-2 font-sans"
                                                    >
                                                        <div className="flex items-center gap-2">
                                                            <IconPlus size={16} /> Add Module Slot
                                                        </div>
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        <div className="bg-slate-50 p-2 flex justify-end gap-2 border-t border-slate-100 font-sans">
                                            <div className="mr-auto flex items-center px-2 border-r border-slate-200">
                                                <button
                                                    onClick={() => moveUnit(unitIndex, -1)}
                                                    disabled={unitIndex === 0}
                                                    className={BTN_FOOTER_CLASS}
                                                    title="Move Unit Up"
                                                >
                                                    <IconArrowUp />
                                                </button>
                                                <button
                                                    onClick={() => moveUnit(unitIndex, 1)}
                                                    disabled={unitIndex === units.length - 1}
                                                    className={BTN_FOOTER_CLASS}
                                                    title="Move Unit Down"
                                                >
                                                    <IconArrowDown />
                                                </button>
                                            </div>
                                            <button
                                                onClick={() => saveUnitToLibrary(unit)}
                                                className={BTN_FOOTER_CLASS}
                                                title="Save Unit to Library"
                                            >
                                                <IconSave size={18} />
                                            </button>
                                            <button
                                                onClick={() => duplicateUnit(unit)}
                                                className={BTN_FOOTER_CLASS}
                                                title="Duplicate Unit"
                                            >
                                                <IconCopy />
                                            </button>
                                            <button
                                                onClick={() => removeUnit(unit.id)}
                                                className={`${BTN_FOOTER_CLASS} hover:text-red-600 hover:bg-red-50`}
                                                title="Delete Unit"
                                            >
                                                <IconTrash />
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 font-sans">
                                <button
                                    onClick={() => addUnit("MAC2")}
                                    className="bg-slate-800 text-white py-4 rounded-lg shadow-sm hover:bg-slate-700 flex justify-center items-center gap-2 font-bold text-lg transition-all"
                                >
                                    <IconPlus size={24} /> Add New Unit
                                </button>
                                
                                <button
                                    onClick={() => setIsUnitLibraryOpen(true)}
                                    className="bg-white border-2 border-slate-300 text-slate-700 py-4 rounded-lg shadow-sm hover:bg-slate-50 flex justify-center items-center gap-2 font-bold text-lg transition-all"
                                >
                                    <IconDatabase size={24} /> Load Unit from Library
                                </button>
                            </div>

                            <div className="text-center text-slate-400 text-sm py-8 font-sans">
                                <span className="font-niagara text-2xl tracking-wide uppercase">The Grill</span>
                                <br />A MAC Attack List Builder
                            </div>
                        </div>

                        {renderForceLibraryModal()}
                        {renderUnitLibraryModal()}

                        {showHelp && (
                            <div
                                className="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4 z-50 no-print font-sans"
                                onClick={() => setShowHelp(false)}
                            >
                                <div
                                    className="bg-white rounded shadow-lg max-w-2xl w-full p-6 text-sm overflow-y-auto max-h-[90vh]"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-4xl font-niagara uppercase tracking-wide text-slate-800">
                                            The Grill
                                            <br />
                                            <span className="text-lg tracking-normal font-sans text-slate-500 font-bold">
                                                A MAC Attack List Builder
                                            </span>
                                        </h3>
                                    </div>

                                    <div className="mb-6 space-y-5 text-slate-600">
                                        <div>
                                            <p className="mb-2">
                                                <strong>MAC Attack</strong> is a sci-fi miniature wargame designed by{" "}
                                                <strong>Chris McDowall</strong>. Published by{" "}
                                                <strong>Bastionland Press</strong>.
                                            </p>
                                            <p className="mb-4">
                                                <a
                                                    href="https://bastionlandpress.com/products/mac-attack"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-blue-600 hover:text-blue-800 underline font-medium"
                                                >
                                                    Official MAC Attack Page
                                                </a>
                                            </p>
                                            <p className="text-xs italic text-slate-500">
                                                This is an unofficial, community-built tool created to support the game.
                                            </p>
                                        </div>

                                        <details className="border border-slate-200 rounded-lg bg-slate-50 overflow-hidden group">
                                            <summary className="cursor-pointer bg-slate-100 px-4 py-3 font-bold text-slate-700 hover:bg-slate-200 transition-colors flex items-center justify-between outline-none">
                                                <span className="flex items-center gap-2"><IconDatabase /> Library & Workspace Guide</span>
                                                <span className="group-open:rotate-180 transition-transform duration-200">
                                                    <IconArrowDown />
                                                </span>
                                            </summary>
                                            <div className="p-4 bg-white text-slate-600 space-y-6 max-h-[50vh] overflow-y-auto">
                                                <section>
                                                    <h5 className="font-bold text-base text-slate-800 border-b border-slate-200 pb-1 mb-2">1. The Local Library</h5>
                                                    <p className="mb-2">Your browser automatically maintains a continuous "Workspace" in the background. As long as you have memory space, everything you do is auto-saved.</p>
                                                    <ul className="space-y-2 list-disc pl-5">
                                                        <li><strong>Saving Forces:</strong> Click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconSave size={14} /></span> icon to write your current active roster into the database. Overwrite prompts will prevent accidental erasure.</li>
                                                        <li><strong>Saving Units:</strong> In the footer of any unit card, click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconSave size={14} /></span> icon to save that specific unit into the library for future lists.</li>
                                                        <li><strong>Loading Data:</strong> Click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconDatabase /></span> icons in the main menu or the bottom of the unit list to bring up your saved templates.</li>
                                                    </ul>
                                                </section>

                                                <section>
                                                    <h5 className="font-bold text-base text-slate-800 border-b border-slate-200 pb-1 mb-2">2. Export, Import, & Merging</h5>
                                                    <p className="mb-2">Clearing your browser cache or switching devices will wipe your data. To secure your rosters, use the file management tools.</p>
                                                    <ul className="space-y-2 list-disc pl-5">
                                                        <li><strong>Export Library:</strong> Click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconDownload size={14} /></span> icon to download your active force and entire library as a master backup file.</li>
                                                        <li><strong>Import Library:</strong> Click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconUpload size={14} /></span> icon to load a file. <strong>Warning:</strong> This will completely overwrite your current browser library.</li>
                                                        <li><strong>Merge Library:</strong> Click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconMerge size={14} /></span> icon to merge forces and units from another file into your current library.</li>
                                                    </ul>
                                                </section>

                                                <section>
                                                    <h5 className="font-bold text-base text-slate-800 border-b border-slate-200 pb-1 mb-2">3. Storage Limits</h5>
                                                    <p className="mb-2">Browsers place a strict 5MB limit on local app data. Text is light, but images are heavy. The Grill auto-compresses portraits, but too many will fill the vault.</p>
                                                    <ul className="space-y-2 list-disc pl-5">
                                                        <li><strong>The Warning Banner:</strong> If you hit the ceiling, a red banner with the <span className="inline-flex items-center align-middle text-red-600 bg-red-50 p-1 rounded border border-red-200 mx-1"><IconAlert /></span> icon will appear. <strong>Auto-saving is disabled when this is visible.</strong></li>
                                                        <li><strong>How to Fix It:</strong> Free up memory by deleting outdated rosters or lists with heavy images from your libraries.</li>
                                                        <li><strong>Failsafe Saving:</strong> If you cannot delete anything, click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconDownload size={14} /></span> icon to bypass the browser memory and download your data to your hard drive.</li>
                                                    </ul>
                                                </section>

                                                <section>
                                                    <h5 className="font-bold text-base text-slate-800 border-b border-slate-200 pb-1 mb-2">4. Wiping the Database</h5>
                                                    <p>Click the <span className="inline-flex items-center align-middle text-slate-500 bg-white p-1 rounded border border-slate-200 mx-1"><IconDatabaseWipe size={14} /></span> icon to permanently delete all saved forces and units from your browser's memory. Always Export your library first!</p>
                                                </section>
                                            </div>
                                        </details>
                                    </div>

                                    <div className="text-center mt-6">
                                        <button
                                            onClick={() => setShowHelp(false)}
                                            className="bg-slate-800 text-white py-2 px-6 rounded font-bold hover:bg-slate-700 transition-colors w-full"
                                        >
                                            Close
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(<MACBuilder />);
        </script>
    </body>
</html>
